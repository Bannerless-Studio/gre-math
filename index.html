<style>
:root {
  --bg: #f7f6f2; --ink: #1d1c19; --muted: #6b675e; --line: #dedad0; --card: #ffffff;
  --accent: #2f5d8a; --accent-ink: #ffffff; --ok: #2d6b3f; --ok-bg: #e5f2e8; --bad: #9a3b2c; --bad-bg: #f7e4df; --amber: #9a5b00;
  --radius: 12px; --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171a; --ink: #ecebe6; --muted: #9b978c; --line: #33323a; --card: #211f26;
    --accent: #7fa8d6; --accent-ink: #111418; --ok: #8fd1a0; --ok-bg: #1f3427; --bad: #f0a494; --bad-bg: #3a2420; --amber: #e8b768;
  }
}
:root[data-theme="dark"] {
  --bg: #17171a; --ink: #ecebe6; --muted: #9b978c; --line: #33323a; --card: #211f26;
  --accent: #7fa8d6; --accent-ink: #111418; --ok: #8fd1a0; --ok-bg: #1f3427; --bad: #f0a494; --bad-bg: #3a2420; --amber: #e8b768;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden; -webkit-text-size-adjust: 100%;
}
.top { padding: 14px var(--gutter) 0; max-width: 620px; margin: 0 auto; }
.top h1 { font-size: 1.05rem; margin: 0 0 10px; font-weight: 650; color: var(--muted); }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); }
.tabs button {
  flex: 1; min-height: 44px; border: 0; background: none; color: var(--muted);
  font: inherit; font-weight: 600; border-bottom: 2px solid transparent; cursor: pointer;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs[hidden] { display: none; }
.wrap { max-width: 620px; margin: 0 auto; padding: 16px var(--gutter) 48px; }
.banner { background: var(--bad-bg); color: var(--bad); padding: 10px var(--gutter); font-size: .95rem; }
.banner[hidden] { display: none; }
.anchor { font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; }
.goal { margin: 2px 0 14px; font-size: 1.1rem; }
.stages { list-style: none; margin: 0 0 18px; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 14px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .name { font-weight: 650; }
.row .dev { color: var(--muted); font-size: .95rem; text-align: right; flex: 1 1 60%; }
.primary, .ghost, .danger, .file-btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px;
  border-radius: var(--radius); font: inherit; font-weight: 650; cursor: pointer; border: 1px solid transparent;
}
.primary { background: var(--accent); color: var(--accent-ink); width: 100%; }
.ghost { background: none; color: var(--muted); border-color: var(--line); min-height: 40px; padding: 0 14px; font-weight: 500; }
.danger { background: none; color: var(--bad); border-color: var(--bad); }
.file-btn { background: none; color: var(--ink); border-color: var(--line); position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
button:focus-visible, input:focus-visible, .file-btn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.empty { color: var(--muted); margin: 18px 0; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: .9rem; color: var(--muted); }
.meter { height: 6px; background: var(--line); border-radius: 3px; margin: 8px 0 16px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 16px; }
.kicker { margin: 0 0 4px; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.card h2 { font-size: 1.3rem; margin: 0 0 10px; }
.prose p { margin: 0 0 .8em; overflow-wrap: anywhere; }
.prose p:last-child { margin-bottom: 0; }
.prose code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92em; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
.opts { display: grid; gap: 10px; margin-top: 16px; }
.opt {
  text-align: left; width: 100%; min-height: 52px; padding: 12px 14px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; cursor: pointer;
}
.opt .prose p { margin: 0; }
.typed { margin-top: 16px; display: grid; gap: 10px; }
.typed input {
  width: 100%; min-height: 52px; padding: 10px 14px; font: inherit; font-size: 1.15rem; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
}
.hint { color: var(--muted); font-size: .9rem; margin: 8px 0 0; min-height: 1.4em; }
.reveal { margin-top: 16px; border-radius: var(--radius); padding: 14px 16px; border: 1px solid var(--line); }
.reveal.ok { background: var(--ok-bg); }
.reveal.bad { background: var(--bad-bg); }
.verdict { font-weight: 700; margin: 0 0 6px; font-size: 1.1rem; }
.reveal.ok .verdict { color: var(--ok); }
.reveal.bad .verdict { color: var(--bad); }
.answer { margin: 0 0 8px; font-weight: 600; }
.note { color: var(--muted); font-size: .92rem; margin: 10px 0 14px; }
.big { font-size: 2.2rem; font-weight: 700; margin: 6px 0; }
.missed { margin-top: 16px; }
.missed .card { margin-top: 10px; }
.techs { list-style: none; padding: 0; margin: 0 0 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.techs li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
.techs li:first-child { border-top: 0; }
.streak { color: var(--muted); white-space: nowrap; font-size: .92rem; }
h3 { font-size: 1rem; margin: 22px 0 6px; color: var(--muted); }
.data { display: grid; gap: 10px; margin-top: 10px; }
.data-msg { min-height: 1.4em; color: var(--muted); font-size: .92rem; margin: 6px 0 0; overflow-wrap: anywhere; }
img, table, pre { max-width: 100%; }
/* M2: display math scrolls inside its own box rather than widening the page */
.katex-display { margin: .6em 0; max-width: 100%; overflow-x: auto; overflow-y: hidden; }
.prose .katex { font-size: 1.08em; }
/* M3/M4: expression echo, multi-select, in-page confirmations, update banner, screen-reader-only text */
.echo { margin: 0; min-height: 1.4em; font-size: .92rem; color: var(--muted); overflow-wrap: anywhere; }
.echo.bad { color: var(--bad); }
.multi { margin-top: 16px; display: grid; gap: 10px; }
.checks { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
.check {
  display: flex; gap: 10px; align-items: flex-start; min-height: 52px; padding: 12px 14px; cursor: pointer;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--ink);
}
.check input { flex: none; width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--accent); }
.check > span { min-width: 0; }
.check .prose p { margin: 0; }
.confirm { margin: 0 0 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.confirm p { margin: 0 0 10px; }
.update {
  display: block; width: calc(100% - 2 * var(--gutter)); max-width: 620px; margin: 10px auto 0; min-height: 44px;
  padding: 10px 14px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--accent); color: var(--accent-ink);
  font: inherit; font-weight: 600; cursor: pointer;
}
.update[hidden] { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* M5 full problems: timed commit, reveal, rubric self-grade, grade */
.clock { margin: 0 0 10px; font-size: 1.05rem; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--muted); }
.clock.over { color: var(--amber); }
.card.full .prose { margin-bottom: 4px; }
.reveal.grade.g2 { background: var(--ok-bg); }
.reveal.grade.g2 .verdict { color: var(--ok); }
.reveal.grade.g1 { background: var(--card); }
.reveal.grade.g0 { background: var(--bad-bg); }
.reveal.grade.g0 .verdict { color: var(--bad); }
.why { margin: 0 0 10px; padding-left: 18px; font-size: .95rem; }
.why li { margin: 2px 0; }
.rubric-form { margin-top: 12px; display: grid; gap: 14px; }
.rubric legend { padding: 0; margin-bottom: 8px; }
.rubric .weight { color: var(--muted); }

/* M6: Test tab (placement, level exam), Progress v2 (level blocks, folded levels, change since last visit), brevity */
.pause-row { margin: 12px 0 0; }
.pause { width: 100%; }
.dk { width: 100%; margin-top: 10px; }
.gate { color: var(--amber); font-weight: 600; margin: 0 0 12px; overflow-wrap: anywhere; }
.delta { color: var(--muted); font-size: .95rem; margin: 0 0 12px; overflow-wrap: anywhere; }
.lv { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin: 0 0 10px; }
.lv-head { display: flex; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; font-weight: 650; }
.lv-head span:last-child { color: var(--muted); font-weight: 500; white-space: nowrap; }
.cells { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin: 8px 0 6px; }
.cells i { display: block; height: 8px; border-radius: 2px; background: var(--line); }
.cells i.on { background: var(--accent); }
.lv-foot { margin: 0; color: var(--muted); font-size: .9rem; }
.lvdet, .folded, .sol { margin-top: 8px; }
.lvdet > summary, .folded > summary, .sol > summary { cursor: pointer; color: var(--muted); font-size: .92rem; padding: 6px 0; min-height: 40px; }
.folded > .lv { margin-top: 8px; }
.sol .prose { margin-top: 6px; }
</style>
</head>

,"techniques":[{"id":"t1.lin-eq","name":"Linear equations","level":"T1","area":"alg","prereq":[],"order":1,"exam":true,"teach":"**When:** an equation where the unknown appears only to the first power. **Move:** apply the same operation to both sides until the unknown stands alone. Undo additions and subtractions before multiplications and divisions. **Example:** $3x-7=2x+5 \\Rightarrow x=12$. **Trap:** operating on one side only, or distributing a minus sign over just the first term of a bracket.","html":{"teach":"<p>When: an equation where the unknown appears only to the first power. Move: apply the same operation to both sides until the unknown stands alone. Undo additions and subtractions before multiplications and divisions. Example: <span role=\"math\" aria-label=\"3x-7=2x+5 \\Rightarrow x=12\">3x−7=2x+5⇒x=12. Trap: operating on one side only, or distributing a minus sign over just the first term of a bracket."}},{"id":"t1.sys-eq","name":"Systems of equations","level":"T1","area":"alg","prereq":["t1.lin-eq"],"order":2,"exam":true,"teach":"**When:** two or three linear equations in the same unknowns. **Move:** eliminate a variable by adding a multiple of one equation to another, or substitute one equation into the other. **Example:** $x+y=10$ and $x-y=4$ give $x=7$. **Trap:** reading $0=5$ as an answer. It means no solution. $0=0$ means infinitely many.","html":{"teach":"<p>When: two or three linear equations in the same unknowns. Move: eliminate a variable by adding a multiple of one equation to another, or substitute one equation into the other. Example: <span role=\"math\" aria-label=\"x+y=10\">x+y=10 and <span role=\"math\" aria-label=\"x-y=4\">x−y=4 give x=7. Trap: reading <span role=\"math\" aria-label=\"0=5\">0=5 as an answer. It means no solution. <span role=\"math\" aria-label=\"0=0\">0=0 means infinitely many."}},{"id":"t1.quad","name":"Quadratic solving","level":"T1","area":"alg","prereq":["t1.lin-eq"],"order":3,"exam":true,"teach":"**When:** $ax^2+bx+c=0$, or an expression that reduces to it. **Move:** factor if the roots are visible. Otherwise use $x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}$. The discriminant $b^2-4ac$ gives the root count without solving. **Example:** $x^2-5x+6=0$ has roots $2$ and $3$. **Trap:** a sign slip on $b$, or forgetting the $2a$ in the denominator.","html":{"teach":"<p>When: <span role=\"math\" aria-label=\"ax^2+bx+c=0\">ax2+bx+c=0, or an expression that reduces to it. Move: factor if the roots are visible. Otherwise use x=2a−b±b2−4ac​​. The discriminant b2−4ac gives the root count without solving. Example: <span role=\"math\" aria-label=\"x^2-5x+6=0\">x2−5x+6=0 has roots 2 and 3. Trap: a sign slip on b, or forgetting the <span role=\"math\" aria-label=\"2a\">2a in the denominator."}},{"id":"t1.factor","name":"Factoring patterns","level":"T1","area":"alg","prereq":["t1.quad"],"order":4,"exam":true,"teach":"**When:** a polynomial with a visible pattern or a known root. **Move:** check difference of squares $a^2-b^2=(a-b)(a+b)$, cubes $a^3\\mp b^3=(a\\mp b)(a^2\\pm ab+b^2)$, then grouping. For $x^2+px+q$ with roots $r,s$: $r+s=-p$ and $rs=q$. **Example:** $x^2-7x+10=(x-2)(x-5)$. **Trap:** $a^2+b^2$ does not factor over the reals.","html":{"teach":"<p>When: a polynomial with a visible pattern or a known root. Move: check difference of squares <span role=\"math\" aria-label=\"a^2-b^2=(a-b)(a+b)\">a2−b2=(a−b)(a+b), cubes <span role=\"math\" aria-label=\"a^3\\mp b^3=(a\\mp b)(a^2\\pm ab+b^2)\">a3∓b3=(a∓b)(a2±ab+b2), then grouping. For <span role=\"math\" aria-label=\"x^2+px+q\">x2+px+q with roots r,s: r+s=−p and rs=q. Example: <span role=\"math\" aria-label=\"x^2-7x+10=(x-2)(x-5)\">x2−7x+10=(x−2)(x−5). Trap: <span role=\"math\" aria-label=\"a^2+b^2\">a2+b2 does not factor over the reals."}},{"id":"t1.poly-div","name":"Polynomial division","level":"T1","area":"alg","prereq":["t1.factor"],"order":5,"exam":true,"teach":"**When:** dividing by $x-c$, or finding roots of a cubic or higher. **Move:** the remainder theorem gives the remainder $p(c)$ with no division. Synthetic division gives the quotient. Rational-root candidates are $\\pm p/q$, with $p$ a factor of the constant term and $q$ a factor of the leading coefficient. **Example:** $p(1)=0$ for $x^3-3x+2$. **Trap:** using $c$ when the divisor is $x+c$; that case needs $-c$.","html":{"teach":"<p>When: dividing by x−c, or finding roots of a cubic or higher. Move: the remainder theorem gives the remainder p(c) with no division. Synthetic division gives the quotient. Rational-root candidates are <span role=\"math\" aria-label=\"\\pm p/q\">±p/q, with <span role=\"math\" aria-label=\"p\">p a factor of the constant term and <span role=\"math\" aria-label=\"q\">q a factor of the leading coefficient. Example: p(1)=0 for <span role=\"math\" aria-label=\"x^3-3x+2\">x3−3x+2. Trap: using <span role=\"math\" aria-label=\"c\">c when the divisor is <span role=\"math\" aria-label=\"x+c\">x+c; that case needs <span role=\"math\" aria-label=\"-c\">−c."}},{"id":"t1.rational-expr","name":"Rational expressions","level":"T1","area":"alg","prereq":["t1.factor"],"order":6,"exam":true,"teach":"**When:** fractions whose numerator and denominator are polynomials. **Move:** factor everything, cancel only common factors, and combine over a common denominator. For equations, multiply through, solve, then discard any root that makes a denominator zero. **Example:** $\\frac{x}{x-2}=\\frac{4}{x-2}$ gives $x=4$. **Trap:** cancelling terms instead of factors, as in $\\frac{x^2+4}{x}\\neq x+4$.","html":{"teach":"<p>When: fractions whose numerator and denominator are polynomials. Move: factor everything, cancel only common factors, and combine over a common denominator. For equations, multiply through, solve, then discard any root that makes a denominator zero. Example: <span role=\"math\" aria-label=\"\\frac{x}{x-2}=\\frac{4}{x-2}\">x−2x​=x−24​ gives x=4. Trap: cancelling terms instead of factors, as in <span role=\"math\" aria-label=\"\\frac{x^2+4}{x}\\neq x+4\">xx2+4​=x+4."}},{"id":"t1.exp-rules","name":"Exponent and radical rules","level":"T1","area":"alg","prereq":[],"order":7,"exam":true,"teach":"**When:** powers with negative, fractional, or integer exponents, and radicals. **Move:** $a^m a^n=a^{m+n}$, $(a^m)^n=a^{mn}$, $a^{-m}=1/a^m$, $a^{m/n}=\\sqrt[n]{a^m}$. To rationalize $\\frac{1}{\\sqrt u-\\sqrt v}$, multiply top and bottom by $\\sqrt u+\\sqrt v$. **Example:** $\\frac{1}{\\sqrt3-1}=\\frac{\\sqrt3+1}{2}$. **Trap:** $(a+b)^n\\neq a^n+b^n$.","html":{"teach":"<p>When: powers with negative, fractional, or integer exponents, and radicals. Move: <span role=\"math\" aria-label=\"a^m a^n=a^{m+n}\">aman=am+n, <span role=\"math\" aria-label=\"(a^m)^n=a^{mn}\">(am)n=amn, <span role=\"math\" aria-label=\"a^{-m}=1/a^m\">a−m=1/am, <span role=\"math\" aria-label=\"a^{m/n}=\\sqrt[n]{a^m}\">am/n=<span class=\"strut\" style=\"height:1.04em;vertical-align:-0.1598em;\"><span class=\"root\"><span class=\"vlist\" style=\"height:0.6475em;\"><span style=\"top:-2.9322em;\"><span class=\"sizing reset-size6 size1 mtight\">n<span class=\"vlist\" style=\"height:0.8802em;\">a<span class=\"vlist\" style=\"height:0.5904em;\">m<span style=\"top:-2.8402em;\">​<span class=\"vlist\" style=\"height:0.1598em;\">. To rationalize <span role=\"math\" aria-label=\"\\frac{1}{\\sqrt u-\\sqrt v}\"><span style=\"top:-2.6259em;\"><span class=\"vlist\" style=\"height:0.8059em;\"><span class=\"mord mathnormal mtight\" style=\"padding-left:0.833em;\">u<span style=\"top:-2.7659em;\">​<span class=\"vlist\" style=\"height:0.2341em;\">−<span class=\"vlist\" style=\"height:0.8059em;\"><span class=\"mord mathnormal mtight\" style=\"margin-right:0.03588em;padding-left:0.833em;\">v<span style=\"top:-2.7659em;\">​<span class=\"vlist\" style=\"height:0.2341em;\">1​, multiply top and bottom by <span role=\"math\" aria-label=\"\\sqrt u+\\sqrt v\"><span class=\"strut\" style=\"height:1.04em;vertical-align:-0.2397em;\"><span class=\"vlist\" style=\"height:0.8003em;\"><span class=\"mord mathnormal\" style=\"padding-left:0.833em;\">u<span style=\"top:-2.7603em;\">​<span class=\"vlist\" style=\"height:0.2397em;\">+<span class=\"strut\" style=\"height:1.04em;vertical-align:-0.2397em;\"><span class=\"vlist\" style=\"height:0.8003em;\"><span class=\"mord mathnormal\" style=\"margin-right:0.03588em;padding-left:0.833em;\">v<span style=\"top:-2.7603em;\">​<span class=\"vlist\" style=\"height:0.2397em;\">. Example: <span role=\"math\" aria-label=\"\\frac{1}{\\sqrt3-1}=\\frac{\\sqrt3+1}{2}\">3​−11​=23​+1​. Trap: <span role=\"math\" aria-label=\"(a+b)^n\\neq a^n+b^n\">(a+b)n=an+bn."}},{"id":"t1.abs-ineq","name":"Absolute value and inequalities","level":"T1","area":"alg","prereq":["t1.quad","t1.rational-expr"],"order":8,"exam":true,"teach":"**When:** absolute values, or a rational or polynomial inequality with sign changes. **Move:** $|u|<b$ means $-b<u<b$; $|u|>b$ means $u<-b$ or $u>b$. For a quotient, find the zeros of numerator and denominator, test each interval, then decide the endpoints. **Example:** $|x-2|\\le 3$ gives $-1\\le x\\le 5$. **Trap:** multiplying by an expression of unknown sign, or including a denominator's zero.","html":{"teach":"<p>When: absolute values, or a rational or polynomial inequality with sign changes. Move: <span role=\"math\" aria-label=\"|u|&lt;b\">∣u∣&lt;b means <span role=\"math\" aria-label=\"-b&lt;u&lt;b\">−b&lt;u&lt;b; <span role=\"math\" aria-label=\"|u|&gt;b\">∣u∣&gt;b means <span role=\"math\" aria-label=\"u&lt;-b\">u&lt;−b or <span role=\"math\" aria-label=\"u&gt;b\">u&gt;b. For a quotient, find the zeros of numerator and denominator, test each interval, then decide the endpoints. Example: <span role=\"math\" aria-label=\"|x-2|\\le 3\">∣x−2∣≤3 gives <span role=\"math\" aria-label=\"-1\\le x\\le 5\">−1≤x≤5. Trap: multiplying by an expression of unknown sign, or including a denominator's zero."}},{"id":"t1.func-basics","name":"Function notation and domain","level":"T1","area":"alg","prereq":[],"order":9,"exam":true,"teach":"**When:** any formula written as $f(x)$. **Move:** substitute the input inside the brackets and simplify. For the domain, exclude zero denominators and negative values under even roots. For piecewise functions, use the branch whose condition holds. **Example:** $f(x)=\\sqrt{8-2x}$ has domain $x\\le 4$. **Trap:** writing $f(a+b)=f(a)+f(b)$. That is almost never true.","html":{"teach":"<p>When: any formula written as <span role=\"math\" aria-label=\"f(x)\">f(x). Move: substitute the input inside the brackets and simplify. For the domain, exclude zero denominators and negative values under even roots. For piecewise functions, use the branch whose condition holds. Example: <span role=\"math\" aria-label=\"f(x)=\\sqrt{8-2x}\">f(x)=8−2x​ has domain <span role=\"math\" aria-label=\"x\\le 4\">x≤4. Trap: writing <span role=\"math\" aria-label=\"f(a+b)=f(a)+f(b)\">f(a+b)=f(a)+f(b). That is almost never true."}},{"id":"t1.compose","name":"Composition and inverse","level":"T1","area":"alg","prereq":["t1.func-basics"],"order":10,"exam":true,"teach":"**When:** combining functions, or undoing one. **Move:** $(f\\circ g)(x)=f(g(x))$, so apply $g$ first. To invert, swap $x$ and $y$ and solve for $y$. Only one-to-one functions have inverses. **Example:** if $f(x)=3x-1$, then $f^{-1}(x)=\\frac{x+1}{3}$. **Trap:** $f^{-1}(x)$ is not $1/f(x)$, and $f\\circ g$ is usually not $g\\circ f$.","html":{"teach":"<p>When: combining functions, or undoing one. Move: <span role=\"math\" aria-label=\"(f\\circ g)(x)=f(g(x))\">(f∘g)(x)=f(g(x)), so apply g first. To invert, swap x and y and solve for y. Only one-to-one functions have inverses. Example: if <span role=\"math\" aria-label=\"f(x)=3x-1\">f(x)=3x−1, then <span role=\"math\" aria-label=\"f^{-1}(x)=\\frac{x+1}{3}\">f−1(x)=3x+1​. Trap: <span role=\"math\" aria-label=\"f^{-1}(x)\">f−1(x) is not <span role=\"math\" aria-label=\"1/f(x)\">1/f(x), and <span role=\"math\" aria-label=\"f\\circ g\">f∘g is usually not <span role=\"math\" aria-label=\"g\\circ f\"><span class=\"strut\" style=\"height:0.6389em;vertical-align:-0.1944em;\">g∘f."}},{"id":"t1.transforms","name":"Graph transformations","level":"T1","area":"alg","prereq":["t1.func-basics"],"order":11,"exam":true,"teach":"**When:** a graph is shifted, stretched, or reflected. **Move:** $f(x-h)+k$ moves right $h$ and up $k$. $af(x)$ stretches by $a$ vertically. $-f(x)$ reflects in the $x$-axis and $f(-x)$ in the $y$-axis. Even functions satisfy $f(-x)=f(x)$. **Example:** $y=(x-3)^2+4$ has vertex $(3,4)$. **Trap:** $f(x+2)$ moves left, the opposite of what the sign suggests.","html":{"teach":"<p>When: a graph is shifted, stretched, or reflected. Move: <span role=\"math\" aria-label=\"f(x-h)+k\">f(x−h)+k moves right h and up k. <span role=\"math\" aria-label=\"af(x)\">af(x) stretches by a vertically. <span role=\"math\" aria-label=\"-f(x)\">−f(x) reflects in the x-axis and <span role=\"math\" aria-label=\"f(-x)\">f(−x) in the y-axis. Even functions satisfy f(−x)=f(x). Example: <span role=\"math\" aria-label=\"y=(x-3)^2+4\">y=(x−3)2+4 has vertex <span role=\"math\" aria-label=\"(3,4)\">(3,4). Trap: <span role=\"math\" aria-label=\"f(x+2)\">f(x+2) moves left, the opposite of what the sign suggests."}},{"id":"t1.coord-geom","name":"Coordinate geometry","level":"T1","area":"alg","prereq":["t1.quad"],"order":12,"exam":true,"teach":"**When:** points, lines, or conics in the plane. **Move:** distance is $\\sqrt{(\\Delta x)^2+(\\Delta y)^2}$. The midpoint averages coordinates. Slope is $\\frac{\\Delta y}{\\Delta x}$. Complete the square to read off the center and radius of $(x-h)^2+(y-k)^2=r^2$. **Example:** $x^2+y^2-6x+4y-3=0$ has center $(3,-2)$ and radius $4$. **Trap:** a vertical line has undefined slope, not slope $0$.","html":{"teach":"<p>When: points, lines, or conics in the plane. Move: distance is <span role=\"math\" aria-label=\"\\sqrt{(\\Delta x)^2+(\\Delta y)^2}\">(Δx)2+(Δy)2​. The midpoint averages coordinates. Slope is <span role=\"math\" aria-label=\"\\frac{\\Delta y}{\\Delta x}\"><span class=\"strut\" style=\"height:1.2694em;vertical-align:-0.345em;\"><span class=\"vlist\" style=\"height:0.9244em;\">ΔxΔy​. Complete the square to read off the center and radius of <span role=\"math\" aria-label=\"(x-h)^2+(y-k)^2=r^2\">(x−h)2+(y−k)2=r2. Example: <span role=\"math\" aria-label=\"x^2+y^2-6x+4y-3=0\">x2+y2−6x+4y−3=0 has center (3,−2) and radius 4. Trap: a vertical line has undefined slope, not slope <span role=\"math\" aria-label=\"0\">0."}},{"id":"t1.geom-formulas","name":"Plane and solid geometry","level":"T1","area":"alg","prereq":[],"order":13,"exam":true,"teach":"**When:** triangles, circles, solids, and similar figures. **Move:** recall area, volume, and Pythagorean relations. Scaling lengths by $k$ scales areas by $k^2$ and volumes by $k^3$. An angle inscribed in a semicircle is $90^\\circ$. **Example:** legs $9$ and $12$ give hypotenuse $15$. **Trap:** using the diameter where the radius is needed.","html":{"teach":"<p>When: triangles, circles, solids, and similar figures. Move: recall area, volume, and Pythagorean relations. Scaling lengths by k scales areas by <span role=\"math\" aria-label=\"k^2\">k2 and volumes by <span role=\"math\" aria-label=\"k^3\">k3. An angle inscribed in a semicircle is <span role=\"math\" aria-label=\"90^\\circ\">90∘. Example: legs 9 and 12 give hypotenuse 15. Trap: using the diameter where the radius is needed."}},{"id":"t2.unit-circle","name":"Unit circle values","level":"T2","area":"alg","prereq":["t1.geom-formulas"],"order":1,"exam":true,"teach":"TODO: teach card","html":{"teach":"<p>TODO: teach card"}},{"id":"t2.trig-id","name":"Trig identities","level":"T2","area":"alg","prereq":["t2.unit-circle"],"order":2,"exam":true,"teach":"TODO: teach card","html": −7"]}},{"id":"t1-0013","tier":"b","type":"micro","level":"T1","tags":["t1.sys-eq"],"critical":[],"difficulty":1,"prompt":"Solve $x+y=10$ and $x-y=4$. Find $x$.","answer":{"kind":"numeric","value":7,"tol":0,"form":"exact"},"check":"(10+4)/2","solution":"Add the equations: $2x=14$, so $x=7$.","hints":["Add the two equations to remove $y$."],"source":{"type":"original","gen":"2026-10-12/haiku-5.5","ver":"checker"},"html":{"prompt":"<p>Solve <span role=\"math\" aria-label=\"x+y=10\">x+y=10 and <span role=\"math\" aria-label=\"x-y=4\">x−y=4. Find x.","solution":"<p>Add the equations: <span role=\"math\" aria-label=\"2x=14\">2x=14, so x=7.","hints":["<p>Add the two equations to remove y."]}},{"id":"t1-0014","tier":"b","type":"micro","level":"T1","tags":["t1.sys-eq"],"critical":[],"difficulty":2,"prompt":"Solve $2x+3y=12$ and $x-y=1$. Find $x+y$.","answer":{"kind":"numeric","value":5,"tol":0,"form":"exact"},"check":"2*Fraction(12-2,5)+1","solution":"Substitute $x=y+1$: $5y+2=12$, so $y=2$ and $x=3$. Then $x+y=5$.","hints":["Substitute $x=y+1$ into the first equation."],"source":{"type":"original","gen":"2026-10-12/haiku-5.5","ver":"checker"},"html":{"prompt":"<p>Solve <span role=\"math\" aria-label=\"2x+3y=12\">2x+3y=12 and <span role=\"math\" aria-label=\"x-y=1\">x−y=1. Find <span role=\"math\" aria-label=\"x+y\">x+y.","solution":"<p>Substitute x=y+1: <span role=\"math\" aria-label=\"5y+2=12\">5y+2=12, so y=2 and x=3. Then x+y=5.","hints":["<p>Substitute x=y+1 into the first equation."]}},{"id":"t1-0015","tier":"b","type":"micro","level":"T1","tags":["t1.sys-eq"],"critical":[],"difficulty":2,"prompt":"Solve $3x-2y=4$ and $6x+y=17$. Find $y$.","answer":{"kind":"numeric","value":"9/5","tol":0,"form":"fraction"},"check":"Fraction(3*17-6*4, 3*1-(-2)*6)","solution":"From the second equation $y=17-6x$. Substituting gives $15x=38$, so $y=\\frac{9}{5}$.","hints":["Solve the second equation for $y$."],"source":{"type":"original","gen":"2026-10-12/haiku-5.5","ver":"checker"},"html":{"prompt":"<p>Solve <span role=\"math\" aria-label=\"3x-2y=4\">3x−2y=4 and <span role=\"math\" aria-label=\"6x+y=17\">6x+y=17. Find y.","solution":"<p>From the second equation <span role=\"math\" aria-label=\"y=17-6x\">y=17−6x. Substituting gives <span role=\"math\" aria-label=\"15x=38\">15x=38, so <span role=\"math\" aria-label=\"y=\\frac{9}{5}\">y=59​.","hints":["<p>Solve the second equation for y."]}},{"id":"t1-0016","tier":"b","type":"micro","level":"T1","tags":["t1.sys-eq"],"critical":[],"difficulty":2,"prompt":"For what $k$ does $2x+ky=3$ have no solution together with $4x+6y=5$?","answer":{"kind":"numeric","value":3,"tol":0,"form":"exact"},"check":"Fraction(2*6,4)","solution":"Parallel needs $\\frac{2}{4}=\\frac{k}{6}$, so $k=3$. Then $\\frac{3}{5}\\neq\\frac{1}{2}$, so the lines are distinct.","hints":["Equal slopes with unequal constant ratio give no solution."],"source":{"type":"original","gen":"2026-10-12/haiku-5.5","ver":"checker"},"html":{"prompt":"<p>For what k does <span role=\"math\" aria-label=\"2x+ky=3\">2x+ky=3 have no solution together with <span role=\"math\" aria-label=\"4x+6y=5\">4x+6y=5?","solution":"<p>Parallel needs <span role=\"math\" aria-label=\"\\frac{2}{4}=\\frac{k}{6}\"> s":["<p>Write the divisor as x−c first."],"options":["3","−3","<span role=\"math\" aria-label=\"\\tfrac13\">31​","<span role=\"math\" aria-label=\"-\\tfrac13\">−31​"]}},{"id":"t1-0040","probe":true,"tier":"b","type":"micro","level":"T1","tags":["t1.poly-div"],"critical":[],"difficulty":1,"prompt":"Let $p(x)=x^3-2x^2+4x-1$. Find the remainder when $p(x)$ is divided by $x-1$.","answer":{"kind":"numeric","value":2,"tol":0,"form":"exact"},"check":"1**3-2*1**2+4*1-1","solution":"$p(1)=1-2+4-1=2$.","hints":["Use the remainder theorem."],"source":{"type":"original","gen":"2026-10-12/haiku-5.5","ver":"checker"},"html":{"prompt":"<p>Let <span role=\"math\" aria-label=\"p(x)=x^3-2x^2+4x-1\">p(x)=x3−2x2+4x−1. Find the remainder when <span role=\"math\" aria-label=\"p(x)\">p(x) is divided by <span role=\"math\" aria-label=\"x-1\">x−1.","solution":"<p><span role=\"math\" aria-label=\"p(1)=1-2+4-1=2\">p(1)=1−2+4−1=2.","hints":["<p>Use the remainder theorem."]}},{"id":"t1-0041","tier":"b","type":"micro","level":"T1","tags":["t1.poly-div"],"critical":[],"difficulty":2,"prompt":"Divide $x^3-3x+2$ by $x-1$. Find the quotient evaluated at $x=2$.","answer":{"kind":"numeric","value":4,"tol":0,"form":"exact"},"check":"2**2+2-2","solution":"$x^3-3x+2=(x-1)(x^2+x-2)$. At $x=2$ the quotient is $4+2-2=4$.","hints":["Use synthetic division with root $1$."],"source":{"type":"original","gen":"2026-10-12/haiku-5.5","ver":"checker"},"html":{"prompt":"<p>Divide <span role=\"math\" aria-label=\"x^3-3x+2\">x3−3x+2 by <span role=\"math\" aria-label=\"x-1\">x−1. Find the quotient evaluated at x=2.","solution":"<p><span role=\"math\" aria-label=\"x^3-3x+2=(x-1)(x^2+x-2)\">x3−3x+2=(x−1)(x2+x−2). At x=2 the quotient is <span role=\"math\" aria-label=\"4+2-2=4\">4+2−2=4.","hints":["<p>Use synthetic division with root 1."]}},{"id":"t1-0042","tier":"b","type":"micro","level":"T1","tags":["t1.poly-div"],"critical":[],"difficulty":2,"prompt":"Find $k$ so that $x-2$ divides $x^3+kx+6$.","answer":{"kind":"numeric","value":-7,"tol":0,"form":"exact"},"check":"Fraction(-(2**3+6),2)","solution":"$p(2)=8+2k+6=14+2k=0$, so $k=-7$.","hints":["Use the remainder theorem with $c=2$."],"source":{"type":"original","gen":"2026-10-12/haiku-5.5","ver":"checker"},"html":{"prompt":"<p>Find k so that x−2 divides <span role=\"math\" aria-label=\"x^3+kx+6\">x3+kx+6.","solution":"<p><span role=\"math\" aria-label=\"p(2)=8+2k+6=14+2k=0\">p(2)=8+2k+6=14+2k=0, so <span role=\"math\" aria-label=\"k=-7\">k=−7.","hints":["<p>Use the remainder theorem with <span role=\"math\" aria-label=\"c=2\">c=2."]}},{"id":"t1-0043","tier":"b","type":"micro","level":"T1","tags":["t1.poly-div"],"critical":[],"difficulty":1,"prompt":"Find the remainder when $x^4+1$ is divided by $x+1$.","answer":{"kind":"numeric","value":2,"tol":0,"form":"exact"},"check":"(-1)**4+1","solution":"$p(-1)=(-1)^4+1=2$.","hints":["The divisor $x+1$ means $c=-1$."],"source":{"type":"original","gen":"2026-10-12/haiku-5.5","ver":"checker"},"html":{"prompt":"<p>Find the remainder when <span role=\"math\" aria-labe   // changed 2026-10-12 after pacing study: a miss costs one streak step, not the whole streak; m = s >= mastered.
  function resetTech(r, mastered) { r.s = Math.max(0, r.s - 1); r.m = r.s >= mastered ? 1 : 0; r.prov = 0; }

  function applyAnswer(prog, ix, sess, card, ok, seconds) {
    var item = card.item, primary = item.tags[0], critical = item.critical || [];
    var it = prog.items[item.id] = prog.items[item.id] || defItem({});
    if (ok) it.r += 1; else it.w += 1;
    it.l = sess.n;
    if (seconds) it.t = nonneg(seconds);
    var out = { credited: false, mastered: false, requeue: false };

    item.tags.slice(1).forEach(function (tag) {
      var r = rec(prog, tag);
      if (ok) r.r += 1;

    var r = rec(prog, primary);
    if (ok) {

      // a right typed tier b answer at streak >= PRODUCTION_STREAK also sets fp (changed 2026-10-12 after pacing study)
      if (item.tier === 'b' && isProduction(card.type) && r.s >= PRODUCTION_STREAK) r.fp = 1;
      var held = r.s >= PRODUCTION_STREAK && !isProduction(card.type);

  // response: display index (mcq) or typed string (numeric).
  function answerCard(prog, ix, sess, response, seconds) {
    var card = currentCard(sess);

  // ---- full problems (SPEC 2.4, 3.4, 5 stage 4). Commit (timed, correctness record), reveal, rubric self-grade.
  function r2(x) { return Math.round(x * 100) / 100; }
  // Share of the budget by difficulty: 1-2 easy, 3 mid, 4-5 hard.
  function budgetFor(cfg, difficulty) {

  function planFull(ctx) {

  function fullCommit(prog, ix, sess, response, seconds) {

  function gradeFullRule(o) {

  function applyFullGrade(prog, ix, sess, card, grade) {

  // ---- placement (SPEC 6, decisions 9). Buckets are tiers in pack order. A bucket's probes are tier b micro items:
  // one per technique, flagged `probe: true` when the tier has any flag, else the first tier b item of each technique.
  function placeProbes(ix, tier) {
    var flagged = [], plain = [];
    (ix.techsByLevel[tier] || []).forEach(function (t) {

      }).sort(function (a, b) { return (a.difficulty - b.difficulty) || cmp(a.id, b.id); });

  function placementPlan(ix, n) {

        return { tier: lv.id, status: 'skip', reason: items.length ? lv.id + ' has ' + items.length + ' probe items, needs ' + PLACE_MIN : 'no probes yet', cards: [] };
      }
      return { tier: lv.id, status: 'ready', reason: null, cards: items.map(function (it) {

  }
  // One attempt per probe and no feedback until the result. Cards are queued bucket by bucket.

    if (!queue.length) return null;
    var levelIndex = {};
    ix.levels.forEach(function (lv, i) { levelIndex[lv.id] = i; });

      }) };
  }
  // Stop rules after a bucket completes (SPEC 6 early stop, CURRICULUM 4.2): a run of empty buckets, or a run of

  // response: display index (mcq) or typed string; dontKnow scores 0 without grading.

    var ok = false;
    if (!dontKnow) {
      var g = gradeCard(card, response);
      if (g.unparsable) return { unparsable: true, error: g.error, detail: g.detail, kind: card.type };

    b.asked += 1;

  }
  // Prefix rule (SPEC 6): the largest k such that buckets 0..k-1 reach PLACE_PASS in total and every one of them has

  function placementResult(sess) {

  // ---- level exam (SPEC 2.6). Offered when the gate is held and the level below it is within EXAM_NEAR_PCT points.

  function finishExam(prog, ix, sess) {

  // Test tab switch. Pause holds Learn only; Review and Full keep running (SPEC 5).

  }


  // ---- session resume (M7). A Today session as plain data. Cards keep their item by id, their option order and

  function cardToData(card) {

    sess.missed = d.missed.map(function (c) { return cardFromData(ix, c); });
    return sess;
  }

  function finishSession(prog, ix, sess) {
    return {
      n: sess.n, scored: sess.scored, right: sess.right,
      missed: sess.missed.map(function (c) {
        return { id: c.item.id, prompt: c.item.prompt, answer: answerText(c), solution: c.item.solution };
      }),
      mastered: sess.mastered.map(function (id) { return ix.techById[id].name; }),
      introduced: sess.introduced.map(function (id) { return ix.techById[id].name; })
    };
  }

  return {
    snapshotSession: snapshotSession, restoreSession: restoreSession,
    PROG_VERSION: PROG_VERSION, REFRESH_SHARE: REFRESH_SHARE, PER_TECH_CAP: PER_TECH_CAP, WIP_CAP: WIP_CAP,
    LEARN_ITEMS: LEARN_ITEMS, PRODUCTION_STREAK: PRODUCTION_STREAK, EXAM_RULE: EXAM_RULE, ANSWER_KINDS: ANSWER_KINDS,
    PLAYABLE: PLAYABLE, PRODUCTION: PRODUCTION,
    NEW_EARLY: NEW_EARLY, NEW_LATER: NEW_LATER, NEW_EARLY_BELOW: NEW_EARLY_BELOW, REVIEW_PROD_SHARE: REVIEW_PROD_SHARE,
    PLACE_PASS: PLACE_PASS, PLACE_PROBES: PLACE_PROBES, PLACE_MIN: PLACE_MIN, PLACE_ZERO_RUN: PLACE_ZERO_RUN,
    PLACE_LOW_RUN: PLACE_LOW_RUN, EXAM_MICRO: EXAM_MICRO, EXAM_FULL: EXAM_FULL, EXAM_PASS: EXAM_PASS,
    EXAM_NEAR_PCT: EXAM_NEAR_PCT,
    hash32: hash32, permutation: permutation,
    itemKind: itemKind, isProduction: isProduction, answerText: answerText, makeCard: makeCard, gradeCard: gradeCard,
    config: config, index: index, newProg: newProg, normalizeProg: normalizeProg,
    knownTech: knownTech, isIntro: isIntro, needsTeach: needsTeach, usedToday: usedToday, touchDay: touchDay,
    levelStatus: levelStatus, gateState: gateState, buildPlan: buildPlan, startSession: startSession,
    newCap: newCap, currentCard: currentCard, advance: advance, applyAnswer: applyAnswer, answerCard: answerCard,
    finishSession: finishSession,
    placementPlan: placementPlan, placeProbes: placeProbes, startPlacement: startPlacement,
    placementAnswer: placementAnswer, placementResult: placementResult, applyPlacement: applyPlacement,
    examLevel: examLevel, startExam: startExam, finishExam: finishExam, setPauseNew: setPauseNew,
    FULL_MIN_TECHS: FULL_MIN_TECHS, FULL_NEAR: FULL_NEAR, FULL_BUDGET: FULL_BUDGET,
    budgetFor: budgetFor, clockFor: clockFor, gradeFullRule: gradeFullRule, planFull: planFull,
    fullCommit: fullCommit, fullGrade: fullGrade, rubricPicks: rubricPicks
  };
});
</script>
<script>
/* problem-engine page: Today, Test (placement, level exam), drill, summary, Progress. All rules live in core.js;
 * checking in answer.js; persistence in store.js. */
(function () {
  'use strict';

  var PE = window.PE, A = window.PEAnswer, ST = window.PEStore, T = window.PEText, DATA = T.unpackData(window.PE_DATA);
  var KEY = 'pe_' + DATA.pack.key;
  var IX = PE.index(DATA);
  var root = document.getElementById('root');
  var S = { tab: 'today', prog: null, readonly: false, notice: '', sess: null, reveal: null, summary: null,
    hint: '', msg: '', cardStart: 0, draft: '', ask: null, placeResult: null, examResult: null, delta: null };

  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  var esc = T.esc;
  // Fallback only: Markdown-lite with $...$ left as typed. The build pre-renders math into item.html and techniques[].html.
  function md(s, inline) { return T.md(s, inline); }
  // Rendered HTML when the build supplied it, else the raw fallback.
  function field(item, name, inline) {
    if (item && item.html && item.html[name] != null) return item.html[name];
    return md(item ? item[name] : '', inline);
  }
  // i is the authored (original) option index.
  function optHtml(item, i) {
    if (item.html && item.html.options && item.html.options[i] != null) return item.html.options[i];
    return md(item.answer.options[i], true);
  }
  // Mirrors core answerText: display, else the correct option(s) for mcq and multi, else the typed value.
  function ansHtml(item, text) {
    var a = item.answer, h = item.html || {};
    if (a.display != null) return h.display != null ? h.display : md(a.display, true);
    var kind = PE.itemKind(item);
    if (kind === 'mcq') return optHtml(item, a.correct);
    if (kind === 'multi') return a.correct.map(function (i) { return optHtml(item, i); }).join(', ');
    return md(text, true);
  }
  function techHtml(card) {
    var t = IX.techById[card.tech];
    return t && t.html && t.html.teach != null ? t.html.teach : md(card.markdown);
  }
  function techName(id) { return IX.techById[id] ? IX.techById[id].name : id; }
  function levelLabel(id) {
    var lv = IX.levels.filter(function (l) { return l.id === id; })[0];
    return lv ? lv.id + ' · ' + lv.label : id;
  }
  function knownCount(prog) { return IX.techs.filter(function (x) { return PE.knownTech(prog.tech[x.id], x); }).length; }
  function masteredCount(prog) { return IX.techs.filter(function (x) { return prog.tech[x.id] && prog.tech[x.id].m === 1; }).length; }

  // ---- storage: core rules in store.js. A null storage (access throws) means read-only.
  function storageOrNull() { try { return window.localStorage || null; } catch (e) { return null; } }
  var store = ST.make(storageOrNull(), KEY, window.PE_BUILD);
  function save() { return store.save(S); }

  // M7 session resume: a Today session in progress is parked after every change (render, and each draft edit).
  // Any other state (finished, quit, placement or exam, no session) drops the parked record.
  var draftTimer = null;
  function syncSession() {
    if (draftTimer) { clearTimeout(draftTimer); draftTimer = null; }
    if (S.sess && !S.sess.kind) {
      if (!S.readonly) store.saveSession({ sess: PE.snapshotSession(S.sess), reveal: S.reveal, draft: S.draft, cs: S.cardStart }, Date.now());
    } else store.dropSession();
  }
  // Reopens the parked session at boot: same item and option order, the timer from its stamp. A record that does
  // not rebuild is dropped and the page opens on Today.
  function resumeParked() {
    var rec = store.readSession(Date.now());
    if (!rec) return false;
    try {
      S.sess = PE.restoreSession(IX, rec.sess);
      S.reveal = rec.reveal || null;
      S.draft = typeof rec.draft === 'string' ? rec.draft : '';
      S.cardStart = typeof rec.cs === 'number' ? rec.cs : Date.now();
      S.hint = ''; S.summary = null; S.ask = null;
      return true;
    } catch (e) {
      S.sess = null; S.reveal = null; store.dropSession();
      return false;
    }
  }

  // Explains why a typed answer was counted wrong, when the checker says so (no-valid-points and friends).
  var WHY = {
    'lowest-terms': 'Write the fraction in lowest terms.',
    'fraction-form': 'Write it as a fraction, like 1/2.',
    'literal-required': 'Type it as a number or a fraction, like 9/2.',
    'no-valid-points': 'Could not evaluate this expression at enough points.'
  };

  // ---- views
  function row(name, dev) {
    return '<li class="row"><span class="name">' + name + '</span>' + (dev ? '<span class="dev">' + esc(dev) + '</span>' : '') + '</li>';
  }
  // The gate sentence (T2 waits: T1 at 62% known.) is the Learn note while the gate holds.
  function learnNote(l) {
    if (l.status === 'ready') {
      var list = l.techs && l.techs.length ? l.techs : (l.tech ? [l.tech] : []);
      return 'New: ' + list.map(function (t) { return techName(t.id); }).join(', ');
    }
    if (l.status === 'paused') return 'Paused';
    return l.reason || '';
  }
  function viewToday() {
    var t = today(), plan = PE.buildPlan(S.prog, IX, t);
    var rows = row('Review', plan.review.status === 'ready' ? '' : plan.review.reason) +
      row('Learn', learnNote(plan.learn)) +
      row('Micro', plan.micro.status === 'ready' ? '' : plan.micro.reason) +
      row('Full', plan.full.status === 'ready' ? '' : plan.full.reason);
    var action = plan.cards.length
      ? '<button type="button" class="primary" data-act="start">Start</button>'
      : '<p class="empty">Nothing due today.</p>';
    var pause = '<button type="button" class="ghost pause" data-act="pause-new"' + (S.readonly ? ' disabled' : '') + '>' +
      (S.prog.pauseNew ? 'Resume new techniques' : 'Pause new techniques') + '</button>';
    return '<section><p class="anchor">Session ' + plan.n + '</p>' +
      '<p class="goal">' + knownCount(S.prog) + ' of ' + IX.techs.length + ' known</p>' +
      '<ol class="stages">' + rows + '</ol>' + action + '<p class="pause-row">' + pause + '</p></section>';
  }

  function stageLabel(card, sess) {
    if (sess && sess.kind === 'exam') return 'Exam';
    if (sess && sess.kind === 'place') return 'Placement';
    return card.stage === 'review' ? 'Review' : card.stage === 'learn' ? 'Learn' : card.stage === 'full' ? 'Full' : 'Micro';
  }

  // Reveal: the verdict, the answer when wrong, the solution, and only the facts that are not routine.
  function revealHtml(card, r) {
    var notes = [], name = techName(card.tech);
    if (!r.ok && WHY[r.error]) notes.push(WHY[r.error]);
    if (r.mastered) notes.push('Mastered: ' + name + '.');
    if (r.requeue) notes.push('Back later in this session. No credit.');
    else if (card.requeued) notes.push('Practice only. No credit.');
    else if (r.choiceNote) notes.push('Choice cards hold the streak here. Type an answer to earn credit.');
    var ans = r.ok ? '' : '<p class="answer">Answer: ' + ansHtml(card.item, r.answer) + '</p>';
    return '<div class="reveal ' + (r.ok ? 'ok' : 'bad') + '">' +
      '<p class="verdict">' + (r.ok ? 'Right' : 'Not quite') + '</p>' + ans +
      '<div class="prose">' + field(card.item, 'solution') + '</div>' +
      (notes.length ? '<p class="note">' + esc(notes.join(' ')) + '</p>' : '') +
      '<button type="button" class="primary" data-act="continue">Continue</button></div>';
  }

  // The problem body for a playable card: options, multi checks, or the typed box.
  function cardBody(card) {
    var body;
    if (card.type === 'mcq') {
      body = '<div class="opts">' + card.order.map(function (orig, i) {
        return '<button type="button" class="opt" data-act="opt" data-i="' + i + '">' + optHtml(card.item, orig) + '</button>';
      }).join('') + '</div>';
    } else if (card.type === 'multi') {
      body = '<form class="multi" id="multi" autocomplete="off"><fieldset class="checks"><legend class="sr">Select all that apply</legend>' +
        card.order.map(function (orig, i) {
          return '<label class="check"><input type="checkbox" name="pick" value="' + i + '"><span>' + optHtml(card.item, orig) + '</span></label>';
        }).join('') + '</fieldset>' +
        '<button type="submit" class="primary">Check</button></form>';
    } else {
      var ph = card.type === 'expression' ? 'e.g. x^2/2 or sqrt(1-x^2)' : 'e.g. 7, 0.5 or 9/2';
      body = '<form class="typed" id="typed" autocomplete="off"><input id="ans" inputmode="text" autocapitalize="off" ' +
        'autocorrect="off" spellcheck="false" placeholder="' + ph + '" aria-label="Your answer">' +
        '<button type="submit" class="primary">Check</button></form>';
      if (card.type === 'expression') body += '<p class="echo" id="echo" aria-live="polite"></p>';
    }
    return body;
  }

  function viewDrill() {
    var sess = S.sess, card = PE.currentCard(sess), total = sess.queue.length;
    var pct = Math.round((sess.pos / total) * 100);
    var quitText = sess.kind === 'place' ? 'End the test? Nothing is saved.' : 'End this session? Answers so far are saved.';
    var head = '<div class="bar"><span>' + stageLabel(card, sess) + ' · ' + (sess.pos + 1) + ' of ' + total + '</span>' +
      (S.ask === 'quit' ? '' : '<button type="button" class="ghost" data-act="quit">End</button>') + '</div>' +
      '<div class="meter"><i style="width:' + pct + '%"></i></div>';
    if (S.ask === 'quit') {
      head += '<div class="confirm"><p>' + quitText + '</p>' +
        '<button type="button" class="danger" data-act="quit-yes">End</button> ' +
        '<button type="button" class="ghost" data-act="cancel">Keep going</button></div>';
    }
    if (card.type === 'teach') {
      return head + '<article class="card"><p class="kicker">New technique</p><h2>' + esc(card.name) + '</h2>' +
        '<div class="prose">' + techHtml(card) + '</div>' +
        '<button type="button" class="primary" data-act="continue">Start problems</button></article>';
    }
    if (card.type === 'full') return head + viewFull(card);
    var body = '<div class="card"><div class="prose">' + field(card.item, 'prompt') + '</div>';
    if (sess.kind === 'place') {
      // Placement gives no feedback: the probe is answered and the next one opens.
      body += cardBody(card) + '<button type="button" class="ghost dk" data-act="dk">I don\'t know</button>';
    } else if (S.reveal) {
      body += revealHtml(card, S.reveal);
    } else {
      body += cardBody(card);
    }
    body += '<p class="hint">' + esc(S.hint) + '</p></div>';
    return head + body;
  }

  // ---- full problem (timed commit, reveal, rubric self-grade, grade)
  function mmss(sec) { var s = Math.max(0, Math.floor(sec)); return Math.floor(s / 60) + ':' + p2(s % 60); }
  var GRADE_WORD = { 2: 'clean', 1: 'holds', 0: 'missed' };
  // Live clock for a full card that is not yet committed. Reads Date.now on every call, so a hidden tab catches up.
  function clockRead() {
    var card = S.sess && PE.currentCard(S.sess);
    if (!card || card.type !== 'full' || card.commit) return null;
    return PE.clockFor(S.cardStart, card.budgetSec, Date.now)();
  }
  function clockLabel(c, budget) { return c.over ? '+' + mmss(c.elapsed - budget) + ' over' : mmss(c.left) + ' left'; }
  var clockHandle = null;
  function tickClock() {
    var el = document.getElementById('clock'), card = S.sess && PE.currentCard(S.sess), c = clockRead();
    if (!el || !c) return stopClock();
    el.textContent = clockLabel(c, card.budgetSec);
    el.className = 'clock' + (c.over ? ' over' : '');
  }
  function startClock() { if (!clockHandle) clockHandle = setInterval(tickClock, 1000); tickClock(); }
  function stopClock() { if (clockHandle) { clearInterval(clockHandle); clockHandle = null; } }
  document.addEventListener('visibilitychange', tickClock);
  document.addEventListener('visibilitychange', function () { if (document.hidden && draftTimer) syncSession(); });
  window.addEventListener('pagehide', function () { if (draftTimer) syncSession(); });
  function rubricHtml(item, i) {
    var h = item.html && item.html.rubric && item.html.rubric[i];
    return h != null ? h : md(item.rubric[i].text, true);
  }
  function viewFull(card) {
    var item = card.item, c = card.commit, g = card.graded, budget = card.budgetSec;
    var numeric = card.kind !== 'mcq';
    var meta = '<p class="kicker">Timed problem · budget ' + mmss(budget) + '</p>';
    var prompt = '<div class="prose">' + field(item, 'prompt') + '</div>';
    if (!c) {
      var live = clockRead();
      var clock = '<p class="clock" id="clock">' + (live ? clockLabel(live, budget) : '') + '</p>';
      var body;
      if (card.kind === 'mcq') {
        body = '<div class="opts">' + card.order.map(function (orig, i) {
          return '<button type="button" class="opt" data-act="opt" data-i="' + i + '">' + optHtml(item, orig) + '</button>';
        }).join('') + '</div>';
      } else {
        body = '<form class="typed" id="typed" autocomplete="off"><input id="ans" inputmode="text" autocapitalize="off" ' +
          'autocorrect="off" spellcheck="false" placeholder="e.g. 7, 0.5 or 9/2" aria-label="Your answer">' +
          '<button type="submit" class="primary">Commit</button></form>';
      }
      return '<div class="card full">' + meta + clock + prompt + body + '<p class="hint">' + esc(S.hint) + '</p></div>';
    }
    var committed = '<p class="kicker">Committed at ' + mmss(c.seconds) + ' of ' + mmss(budget) + (c.over ? ' · over budget' : '') + '</p>';
    if (!g) {
      var list = '<fieldset class="checks rubric"><legend class="note">Self-grade the method. Check each step you did.</legend>' +
        item.rubric.map(function (r, i) {
          return '<label class="check"><input type="checkbox" name="tick" value="' + i + '"><span>' + rubricHtml(item, i) +
            ' <small class="weight">(' + esc(String(r.weight)) + ')</small></span></label>';
        }).join('') + '</fieldset>';
      return '<div class="card full">' + meta + committed +
        '<div class="reveal ' + (c.ok ? 'ok' : 'bad') + '"><p class="verdict">' + (c.ok ? 'Committed right' : 'Committed wrong') + '</p>' +
        (c.ok ? '' : '<p class="answer">Answer: ' + ansHtml(item, String(item.answer.value)) + '</p>') +
        '<div class="prose">' + field(item, 'solution') + '</div>' +
        '<form id="rubric" class="rubric-form" autocomplete="off">' + list +
        '<button type="submit" class="primary">Grade</button></form></div></div>';
    }
    // Grade screen: one grade line, then only the facts that are not routine. The solution was shown at the reveal.
    var name = techName(card.tech), fx = g.effects, facts = [];
    if (g.grade < 2 && g.score < g.pass) facts.push('Rubric ' + g.score + ' of ' + g.total + ', pass at ' + g.pass + '.');
    if (c.over) facts.push('Over budget: ' + mmss(c.seconds) + ' of ' + mmss(budget) + '.');
    if (fx.mastered) facts.push('Mastered: ' + name + '.');
    if (fx.reset) facts.push('Streak reset: ' + name + '.');
    if (fx.weak.length) facts.push('Weak, next Micro starts with: ' + fx.weak.map(techName).join(', ') + '.');
    var why = facts.length ? '<ul class="why">' + facts.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>' : '';
    return '<div class="card full">' + meta + committed +
      '<div class="reveal grade g' + g.grade + '"><p class="verdict">Grade ' + g.grade + ' of 2, ' + GRADE_WORD[g.grade] + '.</p>' + why +
      '<button type="button" class="primary" data-act="continue">Continue</button></div></div>';
  }

  // Summary: the count, the changes, and the missed prompts with the answer. Solutions sit behind a fold.
  function viewSummary() {
    var s = S.summary, miss = s.missed.map(function (m) {
      var it = IX.itemById[m.id];
      var prompt = it ? field(it, 'prompt') : md(m.prompt), sol = it ? field(it, 'solution') : md(m.solution);
      var ans = it ? ansHtml(it, m.answer) : md(m.answer, true);
      return '<article class="card"><div class="prose">' + prompt + '</div>' +
        '<p class="answer">Answer: ' + ans + '</p><details class="sol"><summary>Solution</summary><div class="prose">' + sol + '</div></details></article>';
    }).join('');
    var deltas = [];
    if (s.mastered.length) deltas.push('+' + s.mastered.length + ' mastered: ' + s.mastered.join(', '));
    if (s.introduced.length) deltas.push('New: ' + s.introduced.join(', '));
    return '<section><p class="anchor">Session ' + s.n + ' done</p>' +
      '<p class="big">' + s.right + ' of ' + s.scored + '</p>' +
      (deltas.length ? '<p class="goal">' + esc(deltas.join(' · ')) + '</p>' : '') +
      (miss ? '<h3>Missed</h3><div class="missed">' + miss + '</div>' : '') +
      '<button type="button" class="primary" data-act="home" style="margin-top:18px">Back to Today</button></section>';
  }

  // ---- Test tab: placement (SPEC 6) and the level exam (SPEC 2.6)
  function placeResultHtml(r) {
    // Skipped buckets fold into one row per run (a skip is expected until a tier has probes).
    var rows = '', run = [];
    function flush() {
      if (!run.length) return;
      var lbl = run.length > 1 ? run[0].tier + ' to ' + run[run.length - 1].tier : run[0].tier;
      rows += '<li><span>' + esc(lbl) + '</span><span class="streak">skipped: ' + esc(run[0].reason) + '</span></li>';
      run = [];
    }
    r.buckets.forEach(function (b) {
      if (b.status === 'skip') { if (run.length && run[0].reason.replace(/^\S+ /, '') !== b.reason.replace(/^\S+ /, '')) flush(); run.push(b); return; }
      flush();
      rows += '<li><span>' + esc(b.tier) + '</span><span class="streak">' + b.right + ' of ' + b.asked + '</span></li>';
    });
    flush();
    return '<h3>Placement result</h3><ul class="techs">' + rows + '</ul>';
  }
  function examResultHtml(x) {
    var need = Math.ceil(PE.EXAM_PASS * x.total);
    return '<h3>Level exam</h3><p class="goal">' + esc(x.level) + ': ' + x.right + ' of ' + x.total + '</p>' +
      '<p class="note">' + (x.pass ? 'Passed. ' + x.fp.length + ' techniques marked known.' : 'Not passed. Need ' + need + '.') + '</p>';
  }
  function viewTest() {
    var p = S.prog, ro = S.readonly ? ' disabled' : '', html = '<section><p class="anchor">Test</p>';
    if (p.placedOnce) {
      html += '<p class="goal">Placed. Next: ' + esc(p.pl ? levelLabel(p.pl) : 'none') + '.</p>';
    } else {
      html += '<p class="goal">Not placed yet.</p>' +
        '<p class="note">About 5 problems per level. No feedback until the end. "I don\'t know" scores 0.</p>' +
        '<button type="button" class="primary" data-act="place"' + ro + '>Place me</button>';
    }
    if (S.placeResult) html += placeResultHtml(S.placeResult);
    var lx = PE.examLevel(p, IX);
    if (lx) {
      html += '<h3>Level exam</h3><p class="note">' + esc(lx.id + ' · ' + lx.label) + '. 8 micro and 2 full problems. ' +
        'Pass at 7 of 10 marks the techniques you got right as known.</p>' +
        '<button type="button" class="primary" data-act="exam"' + ro + '>Start exam</button>';
    }
    if (S.examResult) html += examResultHtml(S.examResult);
    if (S.readonly) html += '<p class="note">Read-only: nothing is saved.</p>';
    html += '<p class="data-msg">' + esc(S.msg) + '</p></section>';
    return html;
  }
  function startPlacement() {
    if (S.readonly) return;
    var sess = PE.startPlacement(S.prog, IX);
    if (!sess) { S.msg = 'Nothing to test yet.'; render(); return; }
    S.sess = sess; S.reveal = null; S.hint = ''; S.draft = ''; S.summary = null; S.ask = null;
    S.placeResult = null; S.examResult = null; S.msg = ''; S.cardStart = Date.now();
    render();
  }
  function startExam() {
    if (S.readonly) return;
    var sess = PE.startExam(S.prog, IX, today());
    if (!sess) { S.msg = 'No exam ready.'; render(); return; }
    S.sess = sess; S.reveal = null; S.hint = ''; S.draft = ''; S.summary = null; S.ask = null;
    S.placeResult = null; S.examResult = null; S.msg = ''; S.cardStart = Date.now();
    save(); render();
  }
  function finishPlacement() {
    var res = S.sess.result;
    S.placeResult = res; S.sess = null;
    if (!S.readonly) { PE.applyPlacement(S.prog, IX, res); save(); }
    render();
  }
  function finishExam() {
    S.examResult = PE.finishExam(S.prog, IX, S.sess); S.sess = null; S.tab = 'test';
    save(); render();
  }

  // ---- Progress v2: hero with the change since the last visit, level blocks, folded lower levels
  function levelBlock(p, l) {
    var ts = IX.techsByLevel[l.id] || [];
    var mastered = ts.filter(function (x) { return p.tech[x.id] && p.tech[x.id].m === 1; }).length;
    var started = ts.filter(function (x) { return PE.isIntro(p, x.id); }).length;
    var filled = l.total ? Math.round(l.pct * 10) : 0, cells = '';
    for (var i = 0; i < 10; i++) cells += '<i class="' + (i < filled ? 'on' : '') + '"></i>';
    var on = ts.filter(function (x) { return PE.isIntro(p, x.id); });
    var techs = on.length ? '<details class="lvdet"><summary>Techniques</summary><ul class="techs">' + on.map(function (x) {
      var r = p.tech[x.id];
      return '<li><span>' + esc(x.name) + '</span><span class="streak">' + (r.m ? 'Mastered' : (r.prov ? 'Placed' : r.s + ' of ' + IX.cfg.mastered)) + '</span></li>';
    }).join('') + '</ul></details>' : '';
    return '<div class="lv"><div class="lv-head"><span>' + esc(l.id + ' · ' + l.label) + '</span>' +
      '<span>' + l.known + ' of ' + l.total + ' known</span></div>' +
      '<div class="cells" aria-hidden="true">' + cells + '</div>' +
      (started ? '<p class="lv-foot">' + mastered + ' mastered · ' + started + ' started</p>' : '') + techs + '</div>';
  }
  function viewProgress() {
    var p = S.prog, st = PE.levelStatus(p, IX), gate = PE.gateState(p, IX);
    var started = IX.techs.filter(function (x) { return PE.isIntro(p, x.id); }).length;
    var html = '<section><p class="anchor">' + p.sessions + (p.sessions === 1 ? ' session' : ' sessions') + '</p>' +
      '<p class="goal">' + knownCount(p) + ' of ' + IX.techs.length + ' known · ' + masteredCount(p) + ' mastered · ' + started + ' started</p>';
    if (S.delta) html += '<p class="delta">' + esc(S.delta) + '</p>';
    if (gate.held) html += '<p class="gate">' + esc(gate.sentence) + '</p>';
    // Levels below the first one under 90 percent known fold into one block (the last level always shows).
    var firstOpen = -1;
    st.forEach(function (l, i) { if (firstOpen < 0 && l.total && l.pct < 0.9) firstOpen = i; });
    var cut = firstOpen < 0 ? st.length - 1 : firstOpen;
    var folded = st.slice(0, cut), open = st.slice(cut);
    if (folded.length) {
      var fk = folded.reduce(function (s, l) { return s + l.known; }, 0), ft = folded.reduce(function (s, l) { return s + l.total; }, 0);
      var span = folded.length > 1 ? folded[0].id + ' to ' + folded[folded.length - 1].id : folded[0].id;
      html += '<details class="folded"><summary>' + esc(span) + ' · ' +
        fk + ' of ' + ft + ' known</summary>' + folded.map(function (l) { return levelBlock(p, l); }).join('') + '</details>';
    }
    html += open.map(function (l) { return levelBlock(p, l); }).join('');
    var resetPart = S.ask === 'reset'
      ? '<div class="confirm"><p>Reset all progress? A backup is kept in this browser.</p>' +
        '<button type="button" class="danger" data-act="reset-yes">Reset progress</button> ' +
        '<button type="button" class="ghost" data-act="cancel">Keep progress</button></div>'
      : '<button type="button" class="danger" data-act="reset">Reset progress</button>';
    html += '<h3>Your data</h3><div class="data">' +
      '<button type="button" class="ghost" data-act="export">Export progress (JSON)</button>' +
      '<label class="file-btn">Import progress (JSON)<input type="file" id="import" accept="application/json,.json"></label>' +
      resetPart + '</div>' +
      '<p class="data-msg">' + esc(S.msg) + '</p></section>';
    return html;
  }
  // Entering Progress: the change since the last visit, then the new visit point is saved.
  function visitProgress() {
    var p = S.prog, old = p.pv || {};
    var now = { sn: p.sessions, k: knownCount(p), m: masteredCount(p), full: Object.keys(p.full).length };
    var parts = [];
    [['sn', 'session', 'sessions'], ['k', 'known', 'known'], ['m', 'mastered', 'mastered'], ['full', 'full problem', 'full problems']]
      .forEach(function (d) {
        var n = (now[d[0]] || 0) - (old[d[0]] || 0);
        if (n > 0) parts.push('+' + n + ' ' + (n === 1 ? d[1] : d[2]));
      });
    S.delta = parts.length ? 'Since last visit: ' + parts.join(' · ') + '.' : null;
    p.pv = now;
    save();
  }

  // Live "what was understood" line for expression input. Parse errors show here and on submit; no attempt is counted.
  function updateEcho() {
    var el = document.getElementById('echo');
    if (!el || !S.sess) return;
    var card = PE.currentCard(S.sess), txt = S.draft.trim();
    if (!txt) { el.className = 'echo'; el.textContent = 'Type the expression, for example x^2/2.'; return; }
    var pr = A.parseExpr(txt, card.item.answer.vars || []);
    if (pr.error) { el.className = 'echo bad'; el.textContent = 'Not read: ' + pr.error; return; }
    el.className = 'echo';
    el.textContent = 'Read as ' + A.canon(pr.ast);
  }

  function render() {
    syncSession();
    var nav = document.getElementById('tabs');
    nav.hidden = !!(S.sess || S.summary);
    ['today', 'test', 'progress'].forEach(function (t) {
      document.getElementById('tab-' + t).setAttribute('aria-selected', String(S.tab === t));
    });
    var banner = document.getElementById('banner');
    banner.hidden = !S.notice;
    banner.textContent = S.notice;
    if (S.summary) root.innerHTML = viewSummary();
    else if (S.sess) root.innerHTML = viewDrill();
    else if (S.tab === 'progress') root.innerHTML = viewProgress();
    else if (S.tab === 'test') root.innerHTML = viewTest();
    else root.innerHTML = viewToday();
    if (clockRead()) startClock(); else stopClock();
    window.scrollTo(0, 0);
    var inp = document.getElementById('ans');
    if (inp) { inp.value = S.draft; inp.focus(); }
    updateEcho();
  }

  function secondsSince() { return Math.max(0, Math.floor((Date.now() - S.cardStart) / 1000)); }

  function startSession() {
    var sess = PE.startSession(S.prog, IX, today());
    if (!sess) { S.msg = 'Nothing to do today.'; render(); return; }
    S.sess = sess; S.reveal = null; S.hint = ''; S.draft = ''; S.summary = null; S.ask = null; S.cardStart = Date.now();
    save(); render();
  }

  // Unparsable input: hint only, nothing counted, draft kept.
  function unparsableHint(r) {
    if (r.detail === 'empty') return 'Type an answer first.';
    if (r.kind === 'expression') return 'Not read: ' + r.detail + '.';
    return 'Type a number like 7, 0.5 or 9/2.';
  }

  function commitFull(response) {
    var card = PE.currentCard(S.sess);
    if (card.commit) return;
    var r = PE.fullCommit(S.prog, IX, S.sess, response, secondsSince());
    if (r.unparsable) { S.hint = unparsableHint(r); render(); return; }
    S.hint = ''; S.draft = '';
    save(); render();
  }

  // Placement probe: no reveal. An unparsable typed answer is a hint and no attempt.
  function answerPlace(response, dontKnow) {
    var r = PE.placementAnswer(S.sess, response, dontKnow);
    if (r.unparsable) { S.hint = unparsableHint(r); render(); return; }
    S.hint = ''; S.draft = ''; S.cardStart = Date.now();
    if (r.done) return finishPlacement();
    render();
  }

  function answer(response) {
    if (!S.sess) return;
    if (S.sess.kind === 'place') return answerPlace(response, false);
    if (PE.currentCard(S.sess).type === 'full') return commitFull(response);
    if (S.reveal) return;
    var card = PE.currentCard(S.sess);
    var r = PE.answerCard(S.prog, IX, S.sess, response, secondsSince());
    if (r.unparsable) { S.hint = unparsableHint(r); render(); return; }
    // The choice-card note shows once per session: the first reveal where it applies sets the flag.
    var tc = S.prog.tech[card.tech], choiceHold = r.ok && !r.requeue && !card.requeued && tc && tc.s >= PE.PRODUCTION_STREAK && !PE.isProduction(card.type);
    if (choiceHold && !S.sess.choiceNoted) { r.choiceNote = true; S.sess.choiceNoted = true; }
    S.reveal = r; S.hint = ''; S.draft = '';
    save(); render();
  }

  function next() {
    if (!S.sess) return;
    var cur = PE.currentCard(S.sess);
    if (!cur) return;
    // double tap on Continue must not skip a card
    if (cur.type === 'full' ? !cur.graded : (cur.type !== 'teach' && !S.reveal)) return;
    S.reveal = null; S.hint = ''; S.draft = '';
    if (!PE.advance(S.sess, S.prog)) {
      if (S.sess.kind === 'exam') return finishExam();
      S.summary = PE.finishSession(S.prog, IX, S.sess); S.sess = null;
    }
    S.cardStart = Date.now();
    save(); render();
  }

  function download(name, text) {
    var blob = new Blob([text], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }

  function importFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var r = store.importText(S, String(reader.result));
      if (r.ok) { S.sess = null; S.reveal = null; S.summary = null; }
      S.msg = r.msg; S.ask = null; S.delta = null;
      render();
    };
    reader.readAsText(file);
  }

  // Multi-select: the form's own checkboxes, sent as display indexes.
  function multiPicks() {
    var boxes = document.querySelectorAll('#multi input[name=pick]:checked');
    return Array.prototype.map.call(boxes, function (b) { return Number(b.value); });
  }

  root.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'start') startSession();
    else if (act === 'place') startPlacement();
    else if (act === 'exam') startExam();
    else if (act === 'dk') { if (S.sess && S.sess.kind === 'place') answerPlace(null, true); }
    else if (act === 'pause-new') { if (!S.readonly) { PE.setPauseNew(S.prog, !S.prog.pauseNew); save(); } render(); }
    else if (act === 'opt') answer(Number(el.getAttribute('data-i')));
    else if (act === 'continue') next();
    else if (act === 'quit') { S.ask = 'quit'; render(); }
    else if (act === 'quit-yes') { S.sess = null; S.ask = null; S.tab = 'today'; render(); }
    else if (act === 'home') { S.summary = null; S.tab = 'today'; render(); }
    else if (act === 'cancel') { S.ask = null; render(); }
    else if (act === 'export') {
      try { download('pe_' + DATA.pack.key + '_' + today() + '.json', JSON.stringify(S.prog, null, 2)); S.msg = 'Exported.'; }
      catch (err) { S.msg = 'Export failed: ' + err.message; }
      render();
    }
    else if (act === 'reset') { S.ask = 'reset'; S.msg = ''; render(); }
    else if (act === 'reset-yes') {
      var r = store.reset(S);
      if (r.ok) { S.sess = null; S.reveal = null; S.summary = null; }
      S.msg = r.msg; S.ask = null; S.delta = null; render();
    }
  });
  root.addEventListener('submit', function (e) {
    if (e.target.id === 'typed') {
      e.preventDefault();
      answer(document.getElementById('ans').value);
    } else if (e.target.id === 'rubric') {
      e.preventDefault();
      var card = PE.currentCard(S.sess);
      if (!card || card.type !== 'full' || !card.commit || card.graded) return;
      var ticks = Array.prototype.map.call(document.querySelectorAll('#rubric input[name=tick]:checked'), function (b) { return Number(b.value); });
      PE.fullGrade(S.prog, IX, S.sess, ticks);
      save(); render();
    } else if (e.target.id === 'multi') {
      e.preventDefault();
      var picks = multiPicks();
      if (!picks.length) { S.hint = 'Pick at least one option.'; render(); return; }
      answer(picks);
    }
  });
  root.addEventListener('input', function (e) {
    if (e.target.id !== 'ans') return;
    S.draft = e.target.value;
    // draft edits are parked after a short pause and on hide, not on every keystroke
    if (draftTimer) clearTimeout(draftTimer);
    draftTimer = setTimeout(syncSession, 400);
    if (S.hint) { S.hint = ''; var h = root.querySelector('.hint'); if (h) h.textContent = ''; }
    updateEcho();
  });
  root.addEventListener('change', function (e) {
    if (e.target.id === 'import') importFile(e.target.files[0]);
  });
  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]');
    if (!b) return;
    var t = b.getAttribute('data-tab');
    if (t === 'progress') visitProgress();
    S.tab = t; S.msg = ''; S.ask = null; render();
  });

  // ---- offline cache (sw.js, built next to the page by build.sh; kill switch and rollback in README)
  // A worker that takes over from an earlier one shows the banner. The open page keeps running on what it loaded.
  function registerWorker() {
    if (typeof navigator === 'undefined' || !navigator.serviceWorker) return;
    if (typeof location === 'undefined' || !/^https?:$/.test(location.protocol)) return;
    var sw = navigator.serviceWorker, wasControlled = !!sw.controller;
    sw.addEventListener('controllerchange', function () {
      if (wasControlled) document.getElementById('update').hidden = false;
    });
    var reg = function () { sw.register('sw.js').catch(function () {}); };
    if (document.readyState === 'complete') reg(); else window.addEventListener('load', reg);
  }

  document.getElementById('update').addEventListener('click', function () { location.reload(); });
  document.getElementById('pack-name').textContent = DATA.pack.name;
  document.title = DATA.pack.name;
  store.open(S);
  if (!resumeParked()) S.cardStart = Date.now();
  render();
  registerWorker();
})();
</script>
